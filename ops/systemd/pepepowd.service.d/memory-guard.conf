[Service]
# Keep daemon growth from consuming all host RAM and swap. Values are above the
# observed warm baseline (~2.47G cgroup memory / ~1.42G RSS).
# Keep the soft limit above normal cache-inclusive cgroup charge while leaving
# roughly half of this 6G host available to the OS and pool services.
MemoryHigh=2816M
MemoryMax=3072M
MemorySwapMax=768M
