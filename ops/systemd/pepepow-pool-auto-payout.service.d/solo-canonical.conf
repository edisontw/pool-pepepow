[Service]
# Keep the existing Pool payout runtime unchanged. After it completes, run the
# guarded SOLO payout against the canonical production SOLO runtime.
# SOLO keeps its own bounded send ceiling instead of inheriting the Pool's
# larger operational ceiling.
ExecStartPost=/usr/bin/env PEPEPOW_LIVE_STRATUM_RUNTIME_DIR=/var/lib/pepepow-pool PEPEPOW_SOLO_AUTO_PAYOUT_MAX_SENDS=10 /home/ubuntu/pool-pepepow/ops/scripts/live-stratum.sh solo-auto-payout-once
