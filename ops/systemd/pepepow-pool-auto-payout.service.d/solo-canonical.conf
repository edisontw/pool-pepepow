[Service]
# Keep the existing Pool payout runtime unchanged. After it completes, run the
# guarded SOLO payout against the canonical production SOLO runtime.
# The command inherits the service wallet-payout guards and only overrides the
# runtime root for this invocation.
ExecStartPost=/usr/bin/env PEPEPOW_LIVE_STRATUM_RUNTIME_DIR=/var/lib/pepepow-pool /home/ubuntu/pool-pepepow/ops/scripts/live-stratum.sh solo-auto-payout-once
